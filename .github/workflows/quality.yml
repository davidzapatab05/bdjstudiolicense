name: Quality and security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bdj
          POSTGRES_PASSWORD: bdj_test_password
          POSTGRES_DB: bdj_license
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bdj -d bdj_license"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://bdj:bdj_test_password@localhost:5432/bdj_license?schema=public
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-chars
      CORS_ORIGIN: https://console.example.test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      # El proyecto legado aún no tiene una migración baseline completa;
      # db push verifica el schema en la BD efímera de CI sin tocar producción.
      - run: npx prisma db push
      - run: npm run build
      - run: npm run lint:check
      - run: npm test -- --runInBand
      - run: npm run test:e2e -- --runInBand
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Scan Git history for secrets
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --config .gitleaks.toml --redact --log-opts="--all" /repo
