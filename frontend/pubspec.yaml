name: bdj_studio_license
description: "BDJ Studio offline license administration."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  crypto: ^3.0.6
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.4
  path: ^1.9.1
  path_provider: ^2.1.6
  cupertino_icons: ^1.0.8
  bdj_license_core:
    path: ../../bdj_license_core
  file_picker: ^11.0.3
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/bdj_studio_license_icon.png
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/bdj_studio_license_icon.png"
  adaptive_icon_background: "#0A0C10"
  adaptive_icon_foreground: "assets/bdj_studio_license_icon.png"
